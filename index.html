<!DOCTYPE html>
<html lang="mn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tradely | Онлайн дэлгүүр</title>
<style>
:root{--coral:#f2575d;--navy:#202b48;--cream:#faf8f4;--muted:#777}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--navy);font-family:Arial,Helvetica,sans-serif}
header{background:#fff;padding:12px 5%;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-bottom:1px solid #eee}
.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:800;color:var(--coral);letter-spacing:-1px}.brand img{height:52px;width:52px;object-fit:cover;border-radius:50%}
nav a{color:var(--navy);text-decoration:none;margin:0 12px;font-size:14px}
button{border:0;border-radius:9px;padding:12px 16px;cursor:pointer;font-weight:700}
.primary{background:var(--coral);color:white}.dark{background:var(--navy);color:white}
.hero{padding:55px 5%;background:linear-gradient(120deg,#202b48,#354465);color:white}
.hero .tag{color:#ff9a9e;letter-spacing:2px;font-size:12px;font-weight:bold}.hero h1{font-size:clamp(30px,5vw,52px);max-width:650px;margin:14px 0}.hero p{color:#e4e7ee;max-width:550px;line-height:1.65}
.wrap{max-width:1150px;margin:auto;padding:30px 5%}.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
input,select{padding:12px;border:1px solid #ddd;border-radius:9px;background:white;color:var(--navy);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-top:22px}
.card{background:white;border-radius:14px;overflow:hidden;box-shadow:0 5px 20px #202b4810}
.photo{height:210px;background:#efede8;display:flex;align-items:center;justify-content:center;color:#8b8b8b;font-size:13px}.photo img{width:100%;height:100%;object-fit:cover}
.info{padding:16px}.info h3{margin:0 0 8px;font-size:17px}.desc{font-size:13px;color:var(--muted);min-height:34px}.price{font-weight:bold;font-size:20px;color:var(--coral);margin:12px 0}.add{width:100%;background:var(--navy);color:white}.add:hover{background:var(--coral)}
footer{background:var(--navy);color:#dce0e9;text-align:center;padding:26px;font-size:13px}
@media(max-width:600px){nav a{margin:0 5px}.hero{padding:40px 5%}}
</style></head><body>
